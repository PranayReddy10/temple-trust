name: temple_trust
description: Temple Trust — the app a temple's own team uses to manage its listing on Darshan Saathi.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.2
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  geolocator: ^13.0.1
  image: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Drawn by tool/brand/render.js.
    - assets/brand/logo.png
  # The same faces as the devotee app, so the two feel like one family:
  # a serif for headings, a sans for everything else, and the Indic faces
  # the interface languages need.
  fonts:
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif_400Regular.ttf
        - asset: assets/fonts/NotoSerif_600SemiBold.ttf
          weight: 600
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans_400Regular.ttf
        - asset: assets/fonts/NotoSans_700Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari_400Regular.ttf
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu_400Regular.ttf
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil_400Regular.ttf
    - family: NotoSansKannada
      fonts:
        - asset: assets/fonts/NotoSansKannada_400Regular.ttf
