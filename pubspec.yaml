name: temple_trust
description: Temple Trust — the app a temple's own team uses to manage its listing on Darshan Saathi.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.2
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Drawn by tool/brand/render.js.
    - assets/brand/logo.png
