# Builds the signed Android App Bundle for Google Play, and uploads it to a
# Play track when the Play service account is set up. Run it from the
# Actions tab ("Run workflow"), or push a tag like v1.0.0.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_UPLOAD_KEYSTORE_BASE64  the upload keystore, base64-encoded
#                                   (base64 -w0 darshan-saathi-trust-upload.jks)
#   ANDROID_KEYSTORE_PASSWORD       its store password
#   ANDROID_KEY_ALIAS               the key alias (upload)
#   ANDROID_KEY_PASSWORD            the key password
#   PLAY_SERVICE_ACCOUNT_JSON       optional: a Play Console service account
#                                   with "Release apps" permission; without it
#                                   the bundle is only attached to the run.
# See docs/RELEASE_ANDROID.md.
name: Release Android

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track to upload to
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PACKAGE_NAME: com.darshansaathi.temple_trust
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 is not set. Add the upload key secrets (see docs/RELEASE_ANDROID.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-upload}"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # The version name comes from pubspec.yaml; the version code is this
      # workflow's run number plus 100, so every upload is higher than the
      # last without editing pubspec for each build.
      - name: Build the bundle
        run: flutter build appbundle --release --build-number=$((100 + ${{ github.run_number }}))

      - name: Check it is signed with the upload key
        run: |
          OWNER=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -m1 'Owner:')
          echo "$OWNER"
          if echo "$OWNER" | grep -q 'Android Debug'; then
            echo "::error::The bundle is signed with the debug key; Play refuses it."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: darshan-saathi-trust-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Is Play upload set up?
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "ready=$([ -n "$PLAY_JSON" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      # Production goes up as a draft: roll it out in Play Console after a
      # last look. The other tracks go live to their testers straight away.
      - name: Upload to Google Play
        if: steps.play.outputs.ready == 'yes'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: ${{ (inputs.track || 'internal') == 'production' && 'draft' || 'completed' }}

      - name: Clean up the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties
